name: linux-x86_64-pgo
'on':
  workflow_dispatch: null
  push:
    branches:
    - nx2-lichiistein-linux-pgo
    paths:
    - src/**
    - '!src/tests/**'
    - CMakeLists.txt
    - CMakeModules/**
    - externals/**
    - dist/**
    - tools/**
    - .patch/**
    - cpmfile.json
    - eglantine.profdata
    - .github/workflows/release-binaries.yml
permissions:
  contents: read
concurrency:
  group: linux-x86_64-pgo-${{ github.ref }}
  cancel-in-progress: false
env:
  PGO_LLVM_VERSION: '23'
  BUILD_PLATFORM: linux-x86_64-pgo
jobs:
  build:
    name: Linux x86-64 PGO with FSR4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
    - name: Check out source
      uses: actions/checkout@v5
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf pipx libvulkan-dev g++ gcc git glslang-tools libglu1-mesa-dev \
          libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
          mesa-common-dev nasm ninja-build qt6-base-private-dev \
          qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
          libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
          spirv-tools spirv-headers libusb-1.0-0-dev \
          libboost-dev libboost-fiber-dev libboost-context-dev \
          libopus-dev libasound2-dev ccache llvm python3-venv \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
          libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
          wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
          libgles2-mesa-dev libpipewire-0.3-dev \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

        pipx install cmake==4.4.4
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install Qt on Linux x86_64
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: qtcharts
        cache: true
    - name: Install clang for PGO
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
          sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION" "llvm-$PGO_LLVM_VERSION"
        "clang-$PGO_LLVM_VERSION" --version
    - name: Check PGO profile
      shell: bash
      run: |
        set -euo pipefail
        test -s eglantine.profdata
        "llvm-profdata-$PGO_LLVM_VERSION" show eglantine.profdata
    - name: Restore CPM downloads
      id: cpm-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/cpm
        key: cpm-${{ env.BUILD_PLATFORM }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake',
          'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ env.BUILD_PLATFORM }}-v2-
          cpm-${{ runner.os }}-
    - name: Restore compiler objects
      id: compiler-cache
      uses: actions/cache/restore@v5
      with:
        path: .ccache
        key: objects-linux-x86_64-pgo-llvm23-${{ hashFiles('eglantine.profdata') }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        restore-keys: |
          objects-linux-x86_64-pgo-llvm23-${{ hashFiles('eglantine.profdata') }}-
    - name: Configure Linux
      shell: bash
      run: |
        set -euo pipefail
        flags=(
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DLICHII_TESTS=OFF
          -DLICHII_CMD=ON
          -DLICHII_ROOM=OFF
          -DLICHII_ROOM_STANDALONE=OFF
          -DLICHII_USE_BUNDLED_QT=OFF
          -DENABLE_QT_TRANSLATION=ON
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          -DLICHII_USE_BUNDLED_SDL3=ON
          -DENABLE_SWITCH2_HD_RUMBLE=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DLICHII_BUILD_PLATFORM=${{ env.BUILD_PLATFORM }}
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON
        )
        # Same flags Eden's CI passes for its clang PGO build.
        profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
          -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
        flags+=(
          "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
          "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
          "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
          "-DCMAKE_C_FLAGS=$profile"
          "-DCMAKE_CXX_FLAGS=$profile"
        )
        cmake -S . -B build/release -G Ninja "${flags[@]}"
    - name: Save CPM downloads
      if: steps.cpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .cache/cpm
        key: ${{ steps.cpm-cache.outputs.cache-primary-key }}
    - name: Test Switch 2 USB rumble backend
      shell: bash
      run: |
        python3 tools/input/test_switch2_sdl_patch.py \
          --cc "clang-$PGO_LLVM_VERSION"
    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        ccache --zero-stats
        cmake --build build/release --target lichii lichii-cmd --parallel "$(nproc)" -- -k 0
        ccache --show-stats
    - name: Save compiler objects
      if: always() && steps.compiler-cache.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: .ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
    - name: Restore fsr4-vk
      id: fsr4-vk
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/fsr4-vk
        key: fsr4-vk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fsr4-vk/build.sh') }}
    - name: Build fsr4-vk
      if: steps.fsr4-vk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/fsr4-python"
        "$RUNNER_TEMP/fsr4-python/bin/pip" install --disable-pip-version-check zstandard==0.25.0
        export PATH="$RUNNER_TEMP/fsr4-python/bin:$PATH"
        bash tools/fsr4-vk/build.sh "$RUNNER_TEMP/fsr4-vk-work" "$RUNNER_TEMP/fsr4-vk"
    - name: Save fsr4-vk
      if: steps.fsr4-vk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/fsr4-vk
        key: ${{ steps.fsr4-vk.outputs.cache-primary-key }}
    - name: Package Linux AppImage and tar.gz
      shell: bash
      run: |
        set -euo pipefail
        test -x build/release/bin/lichii
        test -x build/release/bin/eden-cli
        strip build/release/bin/lichii build/release/bin/eden-cli
        tools="$RUNNER_TEMP/linuxdeploy"
        mkdir -p "$tools"
        arch=$(uname -m)   # aarch64 or x86_64
        curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
        curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
        chmod +x "$tools"/*.AppImage
        # The desktop file names its icon io.github.zortos293.lichii.
        icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
        cp dist/lichii.png "$icon"
        export APPIMAGE_EXTRACT_AND_RUN=1
        export QMAKE="$QT_ROOT_DIR/bin/qmake"
        # Include Wayland platform plugins and their graphics/shell integrations.
        export EXTRA_QT_MODULES=waylandcompositor
        export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
        # Embedded in the AppImage metadata; matches the release tag (build-N) plus the commit.
        export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
        export LDAI_OUTPUT="lichii-${GITHUB_SHA}-${{ env.BUILD_PLATFORM }}.AppImage"
        export OUTPUT="$LDAI_OUTPUT"
        export ARCH="$arch"
        mkdir -p AppDir/usr/bin AppDir/usr/share/licenses
        cp dist/licenses/switch2-pico.txt AppDir/usr/share/licenses/
        cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
        # The emulator loads fsr4-vk from <exe dir>/../lib (FfxRuntime::PortLibrary).
        fsr4=amd_fidelityfx_upscaler_vk.so
        fsr4_library=()
        if [ "$arch" = x86_64 ]; then
          cp -r "$RUNNER_TEMP/fsr4-vk/licenses/fsr4-vk" AppDir/usr/share/licenses/
          fsr4_library=(--library "$RUNNER_TEMP/fsr4-vk/$fsr4")
        fi
        "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
          --executable build/release/bin/lichii \
          --executable build/release/bin/eden-cli \
          "${fsr4_library[@]}" \
          --desktop-file dist/io.github.zortos293.lichii.desktop \
          --icon-file "$icon" \
          --plugin qt \
          --output appimage
        test -s "$LDAI_OUTPUT"
        ls -la "$LDAI_OUTPUT"
        test -f AppDir/usr/bin/qt.conf
        mv AppDir lichii
        ln -s usr/bin/lichii lichii/lichii
        ln -s usr/bin/eden-cli lichii/eden-cli
        tar -czf "lichii-${GITHUB_SHA}-${{ env.BUILD_PLATFORM }}.tar.gz" lichii
        ls -la "lichii-${GITHUB_SHA}-${{ env.BUILD_PLATFORM }}.tar.gz"
        # Both x86-64 packages must carry fsr4-vk and its licences.
        if [ "$arch" = x86_64 ]; then
          test "$(tar -tzf "lichii-${GITHUB_SHA}-${{ env.BUILD_PLATFORM }}.tar.gz" |
            grep -cFx -e "lichii/usr/lib/$fsr4" -e lichii/usr/share/licenses/fsr4-vk/LICENSE \
              -e lichii/usr/share/licenses/fsr4-vk/AMD-FidelityFX-SDK-license.md)" = 3
          extract="$RUNNER_TEMP/appimage-check"
          mkdir -p "$extract"
          (cd "$extract" &&
            "$GITHUB_WORKSPACE/$LDAI_OUTPUT" --appimage-extract "usr/lib/$fsr4" > /dev/null)
          cmp "$extract/squashfs-root/usr/lib/$fsr4" "lichii/usr/lib/$fsr4"
          nm -D --defined-only "lichii/usr/lib/$fsr4" | grep -w ffxCreateContext
        fi
    - name: Upload Linux binary
      uses: actions/upload-artifact@v7
      with:
        name: lichii-${{ env.BUILD_PLATFORM }}-${{ github.sha }}
        path: |
          lichii-${{ github.sha }}-${{ env.BUILD_PLATFORM }}.tar.gz
          lichii-${{ github.sha }}-${{ env.BUILD_PLATFORM }}.AppImage
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
